name: Website

on:
  push:
    branches: [main]
    paths: [apps/website/**, apps/desktop/src-tauri/icons/icon.png, docs/assets/native-macos/**, .github/workflows/website*.yml]
  pull_request:
    paths: [apps/website/**, apps/desktop/src-tauri/icons/icon.png, docs/assets/native-macos/**, .github/workflows/website*.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'nexum-pages-production' || format('nexum-pages-preview-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  website:
    name: Website build and release validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - run: node --test apps/website/*.test.mjs
      - run: node apps/website/build.mjs
        env:
          SITE_BASE_PATH: ${{ github.ref == 'refs/heads/main' && (steps.pages.outputs.base_path || '/') || '/Nexum/' }}
      - uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: apps/website/dist
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/website/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: website
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
