[package]
name = "nexum-desktop"
version = "0.1.0"
description = "Nexum desktop application"
edition = "2024"

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-shell = "=2.3.6"
tauri-plugin-opener = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nexum-protocol = { path = "../../../crates/protocol" }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
percent-encoding = "2"
tokio = { version = "1", features = ["rt", "time"] }
getrandom = "0.3"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }
security-framework-sys = { version = "2.17", default-features = false }

[lib]
name = "desktop_lib"
path = "src/desktop_lib.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
rcgen = "0.13"
