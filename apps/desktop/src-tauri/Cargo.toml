[package]
name = "nexum-desktop"
version = "0.1.0"
description = "Nexum desktop application"
edition = "2024"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "desktop_lib"
path = "src/desktop_lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
