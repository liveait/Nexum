[package]
name = "nexum-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Nexum local JSON-RPC server"

[dependencies]
base64 = "=0.22.1"
getrandom = "=0.3.4"
nexum-core = { path = "../../crates/core" }
nexum-protocol = { path = "../../crates/protocol" }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

[dev-dependencies]
rcgen = "0.13"
rusqlite = { version = "0.37", features = ["bundled"] }
