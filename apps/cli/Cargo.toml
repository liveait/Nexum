[package]
name = "nexum-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Nexum command-line client"

[dependencies]
nexum-protocol = { path = "../../crates/protocol" }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
