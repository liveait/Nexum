[package]
name = "nexum-security"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Nexum security component"

[dependencies]
serde = { version = "1", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
