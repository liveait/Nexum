[package]
name = "nexum-storage"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Nexum storage component"

[dependencies]
nexum-domain = { path = "../domain" }
nexum-task = { path = "../task" }
rusqlite = { package = "rusqlite", version = "0.37", features = ["bundled"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "=0.3.4"
